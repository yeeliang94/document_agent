<!doctype html>
<!-- PROTOTYPE ONLY: the file panel at full screen, with every file of the run a click away. Made-up data. Open this
     file in a browser; no server needed. The dark bar at the bottom jumps between states; it is not part of the
     design. Nothing here is wired to the app.
     Drawn to sit with the app as it is: the file panel, its View / Comment switch, sheet tabs and Changes switch are
     the app's own. New: Full screen is offered for the Files list too (not only an open file), and at full screen a
     list of the run's files sits on the left, so another output, a source or the agent's notes opens without leaving
     full screen. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full screen files prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --panel: #f5f5f6; --sheet: #ffffff; --text: #18181b; --muted: #6e6e76; --faint: #a3a3ab;
    --line: #e7e7ea; --accent: #2f6fdb; --accent-bg: #e8f0fd; --ok-bg: #e6f3e6; --ok-fg: #24592a;
    --grey-bg: #ececee; --grey-fg: #55555c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.6 Geist, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: 22px; font-weight: 500; }
  h2 { font-size: 15px; font-weight: 500; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  .icon-btn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
  .icon-btn:hover { background: var(--grey-bg); color: var(--text); }
  .icon-btn[aria-pressed="true"] { color: var(--text); }
  .pill { display: inline-block; font-size: 12px; line-height: 20px; padding: 0 10px; border-radius: 999px; background: var(--grey-bg); color: var(--grey-fg); white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .modes { background: var(--grey-bg); border-radius: 999px; padding: 2px; display: flex; }
  .modes button { padding: 2px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
  .modes button[aria-pressed="true"] { background: var(--sheet); color: var(--text); }

  /* The app as it is: sidebar, chat, file panel */
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100%; }
  .side { padding: 24px 12px 16px; display: flex; flex-direction: column; gap: 16px; }
  .brand { font-weight: 500; padding: 0 12px; }
  .item { display: block; padding: 8px 12px; border-radius: 12px; color: var(--muted); text-align: left; width: 100%; }
  .item.on { background: var(--panel); color: var(--text); }
  .work { display: grid; grid-template-columns: minmax(320px, 1fr) 16px minmax(460px, 1.2fr); min-width: 0; min-height: 0; padding: 16px 16px 16px 0; }
  .chat { padding: 16px 32px; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  .say { color: var(--text); max-width: 60ch; }
  .card { display: flex; align-items: center; gap: 12px; background: var(--panel); border-radius: 12px; padding: 12px 16px; }
  .card span:first-child { flex: 1; }
  .grip { display: grid; place-items: center; }
  .grip::after { content: ''; width: 2px; height: 32px; border-radius: 2px; background: var(--line); }

  .files { background: var(--panel); border-radius: 12px; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .files-head { display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px 24px; min-height: 60px; }
  .files-head h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files-body { flex: 1; overflow: auto; padding: 8px 24px 24px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }

  /* Full screen: the panel fills the window. A list of the run's files sits on its left. */
  .app.full .side, .app.full .chat, .app.full .grip { display: none; }
  .app.full { grid-template-columns: 1fr; }
  .app.full .work { grid-template-columns: 1fr; padding: 0; }
  .app.full .files { border-radius: 0; display: grid; grid-template-columns: 264px minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .app.full.no-rail .files { grid-template-columns: minmax(0, 1fr); }
  .app.full .files-head { grid-column: 1 / -1; padding: 16px 24px 12px 24px; }
  .rail { display: none; }
  .app.full .rail { display: flex; flex-direction: column; gap: 16px; padding: 8px 12px 24px 16px; overflow: auto; min-height: 0; }
  .app.full.no-rail .rail { display: none; }
  .app.full .files-body { padding: 8px 32px 24px 16px; }
  .rail input { width: 100%; border: 0; background: var(--sheet); border-radius: 12px; padding: 6px 12px; outline: none; font-size: 13px; }
  .rail h3 { font-size: 12px; font-weight: 500; color: var(--muted); padding: 0 8px 4px; }
  .rail .f { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 8px; border-radius: 8px; font-size: 13px; color: var(--muted); }
  .rail .f span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail .f:hover { background: var(--grey-bg); color: var(--text); }
  .rail .f[aria-current="true"] { background: var(--sheet); color: var(--text); }
  .rail .folder { font-size: 12px; color: var(--faint); padding: 8px 8px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail .count { font-size: 12px; color: var(--faint); }
  .rail .more { font-size: 13px; color: var(--muted); padding: 4px 8px; text-align: left; }

  /* A file on show */
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bar .spacer { flex: 1; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { padding: 2px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
  .tabs button.on { background: var(--sheet); color: var(--text); }
  .sheet { background: var(--sheet); border-radius: 12px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .grid td, .grid th { padding: 8px 12px; text-align: left; box-shadow: inset 0 -1px 0 var(--line); white-space: nowrap; }
  .grid th { color: var(--faint); font-weight: 400; }
  .grid td.rn { color: var(--faint); width: 32px; text-align: right; }
  .grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .grid tr.head td { background: #253b5b; color: #fff; font-weight: 500; }
  .grid td.ring { box-shadow: inset 0 0 0 2px var(--accent); }
  .doc { background: var(--sheet); border-radius: 12px; padding: 24px 32px; max-width: 760px; }
  .doc h3 { font-size: 15px; font-weight: 500; margin: 16px 0 4px; }
  .doc p { color: var(--text); }
  .list-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; }
  .list-row:hover { background: var(--grey-bg); }
  .list-row span:first-child { flex: 1; }

  .pop { position: absolute; width: 300px; background: var(--bg); border-radius: 12px; padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.12); display: flex; flex-direction: column; gap: 12px; z-index: 5; }
  .pop textarea { border: 0; background: var(--panel); border-radius: 12px; padding: 8px 12px; min-height: 64px; resize: none; font: inherit; outline: none; }
  .pop .end { display: flex; justify-content: flex-end; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 13px; }
  .btn.primary { background: var(--text); color: #fff; }
  .btn.text { color: var(--muted); }

  .switcher { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #18181b; color: #fff; border-radius: 999px; padding: 4px; display: flex; gap: 2px; font-size: 12px; z-index: 9; }
  .switcher button { padding: 4px 12px; border-radius: 999px; color: #c9c9cf; white-space: nowrap; }
  .switcher button.on { background: #fff; color: #18181b; }
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="side">
    <div class="brand">Document Intelligence</div>
    <div><button class="item on">October 2026 payroll</button><button class="item">September 2026 payroll</button></div>
  </nav>
  <div class="work">
    <section class="chat">
      <h1>October 2026 payroll</h1>
      <p class="say">The workbook is ready: 215 employees across five entities, with the October UK leaver cut off and the Singapore joiners prorated.</p>
      <div class="card"><span>output_template_output.xlsx</span><span class="pill ok">Checked</span></div>
    </section>
    <div class="grip"></div>
    <section class="files" id="files">
      <header class="files-head" id="head"></header>
      <aside class="rail" id="rail" aria-label="Files in this run"></aside>
      <div class="files-body" id="body"></div>
    </section>
  </div>
</div>
<div class="switcher" id="switcher"></div>

<script>
const I = {
  expand: '<path d="M10 2.5h3.5V6M6 13.5H2.5V10M13.5 2.5 9.5 6.5M2.5 13.5l4-4"/>',
  shrink: '<path d="M2.5 9.5h4v4M13.5 6.5h-4v-4M9.5 6.5l4-4M6.5 9.5l-4 4"/>',
  back: '<path d="M10 4 6 8l4 4"/>',
  x: '<path d="M4 4l8 8M12 4l-8 8"/>',
  side: '<path d="M2.5 3.5h11v9h-11zM6.5 3.5v9"/>',
  find: '<path d="M7 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM10.5 10.5 14 14"/>',
  down: '<path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/>',
};
const svg = (n) => `<svg viewBox="0 0 16 16">${I[n]}</svg>`;
const $ = (s) => document.querySelector(s);

const FILES = {
  outputs: [{ name: 'output_template_output.xlsx', pill: ['ok', 'Checked'] }],
  records: [{ name: 'notes.md' }, { name: 'document_map.json' }, { name: 'provenance.json' }],
  sources: [
    ['Region_APAC / Singapore', ['SG01_Payroll_Oct2026_FINAL.xlsx', 'SG01_Payroll_Oct2026_v1_DRAFT_superseded.xlsx']],
    ['Region_APAC / Malaysia', ['MY Payroll October.xlsx']],
    ['Region_AMER / USA', ['us01_payroll_register_2026-10.csv']],
    ['Group Finance', ['October close instructions.txt', 'fx_rates_2026.xlsx']],
  ],
};
let state = { full: false, rail: true, open: 'output_template_output.xlsx', comment: false, mode: 'View' };

function head() {
  const back = state.open ? `<button class="icon-btn" data-go="" aria-label="Back to files" title="Back to files">${svg('back')}</button>` : '';
  const title = state.open || 'Files';
  const railBtn = state.full ? `<button class="icon-btn" data-rail aria-pressed="${state.rail}" aria-label="${state.rail ? 'Hide' : 'Show'} the file list" title="${state.rail ? 'Hide' : 'Show'} the file list">${svg('side')}</button>` : '';
  const modes = state.open ? `<div class="modes">${['View', 'Comment'].map((m) => `<button aria-pressed="${state.mode === m}" data-mode="${m}">${m}</button>`).join('')}</div>` : '';
  const tools = state.open ? `<button class="icon-btn" aria-label="Find" title="Find">${svg('find')}</button><button class="icon-btn" aria-label="Download" title="Download">${svg('down')}</button>` : '';
  const full = `<button class="icon-btn" data-full aria-pressed="${state.full}" aria-label="${state.full ? 'Exit full screen' : 'Full screen'}" title="${state.full ? 'Exit full screen (Esc)' : 'Full screen'}">${svg(state.full ? 'shrink' : 'expand')}</button>`;
  const close = state.full ? '' : `<button class="icon-btn" aria-label="Close" title="Close">${svg('x')}</button>`;
  $('#head').innerHTML = `${railBtn}${state.full ? '' : back}<h2>${title}</h2>${modes}${tools}${full}${close}`;
}

function rail() {
  const f = (name, pill) => `<button class="f" data-go="${name}" aria-current="${state.open === name}"><span title="${name}">${name}</span>${pill ? `<span class="pill ${pill[0]}">${pill[1]}</span>` : ''}</button>`;
  const sources = FILES.sources.map(([folder, names]) => `<div class="folder" title="${folder}">${folder}</div>${names.map((n) => f(n)).join('')}`).join('');
  $('#rail').innerHTML = `<input placeholder="Find a file" aria-label="Find a file">
    <div><h3>Outputs</h3>${FILES.outputs.map((o) => f(o.name, o.pill)).join('')}</div>
    <div><h3>Agent's notes</h3>${FILES.records.map((o) => f(o.name)).join('')}</div>
    <div><h3>Sources <span class="count">· 11</span></h3>${sources}<button class="more">Show all 11</button></div>`;
}

function sheet(rows, ring) {
  return `<div class="bar"><div class="tabs">${['Employees', 'Entity Summary', 'File Map', 'Lists'].map((t, i) => `<button class="${i === 0 ? 'on' : ''}">${t}</button>`).join('')}</div><span class="spacer"></span><div class="modes"><button aria-pressed="false">Changes</button></div></div>
    <div class="sheet" style="position:relative"><table class="grid"><thead><tr><th></th>${'ABCDEF'.split('').map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>
    ${rows.map((r, i) => `<tr class="${i === 0 ? 'head' : ''}"><td class="rn">${i + 1}</td>${r.map((v, c) => `<td class="${typeof v === 'number' ? 'num' : ''} ${ring && ring[0] === i && ring[1] === c ? 'ring' : ''}">${typeof v === 'number' ? v.toLocaleString('en') : v}</td>`).join('')}</tr>`).join('')}
    </tbody></table>${state.comment ? `<div class="pop" style="left:420px;top:150px"><h2>Employees, cell F3</h2><textarea placeholder="What should change?"></textarea><div class="end"><button class="btn text">Cancel</button><button class="btn primary">Add comment</button></div></div>` : ''}</div>`;
}

const OUTPUT = [['Entity', 'Employee ID', 'Employee Name', 'Department', 'Currency', 'Base Salary'], ...Array.from({ length: 18 }, (_, i) => ['SG01', `SG00${String(i + 1).padStart(2, '0')}`, ['Jordan Hollis', 'Quinn Brook', 'Parker Hollis', 'Leon Stroud', 'Indigo Hollis', 'Sage Pemberton'][i % 6], ['Engineering', 'Operations', 'People', 'Sales'][i % 4], 'SGD', 4600 + i * 350])];
const SOURCE = [['Emp ID', 'Name', 'Dept', 'Base', 'Allowance', 'Start'], ...Array.from({ length: 18 }, (_, i) => [`SG00${String(i + 1).padStart(2, '0')}`, ['Jordan Hollis', 'Quinn Brook', 'Parker Hollis', 'Leon Stroud', 'Indigo Hollis', 'Sage Pemberton'][i % 6], ['Engineering', 'Operations', 'People', 'Sales'][i % 4], 4600 + i * 350, 400 + i * 20, '2024-0' + ((i % 9) + 1) + '-01'])];

function body() {
  if (!state.open) {
    $('#body').innerHTML = `<div><h3 style="font-size:13px;color:var(--muted);font-weight:500;margin-bottom:4px">Outputs</h3>${FILES.outputs.map((o) => `<div class="list-row"><span>${o.name}</span><span class="pill ok">Checked</span></div>`).join('')}</div>
      <div><h3 style="font-size:13px;color:var(--muted);font-weight:500;margin-bottom:4px">Sources</h3>${FILES.sources.flatMap(([, n]) => n).map((n) => `<div class="list-row"><span>${n}</span></div>`).join('')}</div>`;
  } else if (state.open.endsWith('.md')) {
    $('#body').innerHTML = `<div class="doc"><h3>Which file won</h3><p>SG01_Payroll_Oct2026_FINAL.xlsx over the v1 draft, which is marked superseded.</p><h3>Left out</h3><p>The UK leaver after the 15 October cut-off.</p><h3>Assumptions</h3><p>Stipends are included as allowances; no separate one-time-payment field was found.</p></div>`;
  } else if (state.open.startsWith('SG01')) {
    $('#body').innerHTML = sheet(SOURCE, [10, 3]);
  } else {
    $('#body').innerHTML = sheet(OUTPUT, null);
  }
}

function draw() {
  const app = $('#app');
  app.classList.toggle('full', state.full);
  app.classList.toggle('no-rail', !state.rail);
  head();
  rail();
  body();
}

document.addEventListener('click', (e) => {
  const t = (s) => e.target.closest(s);
  let el;
  if (t('[data-full]')) state.full = !state.full;
  else if (t('[data-rail]')) state.rail = !state.rail;
  else if ((el = t('[data-go]'))) Object.assign(state, { open: el.dataset.go || null, comment: false });
  else if ((el = t('[data-mode]'))) Object.assign(state, { mode: el.dataset.mode, comment: el.dataset.mode === 'Comment' });
  else return;
  draw();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.full) { state.full = false; draw(); }
});

const STATES = [
  ['Today: panel beside chat', { full: false, rail: true, open: 'output_template_output.xlsx', comment: false, mode: 'View' }],
  ['Full screen', { full: true, rail: true, open: 'output_template_output.xlsx', comment: false, mode: 'View' }],
  ['Open a source', { full: true, rail: true, open: 'SG01_Payroll_Oct2026_FINAL.xlsx', comment: false, mode: 'View' }],
  ["Agent's notes", { full: true, rail: true, open: 'notes.md', comment: false, mode: 'View' }],
  ['Comment at full screen', { full: true, rail: true, open: 'output_template_output.xlsx', comment: true, mode: 'Comment' }],
  ['List hidden', { full: true, rail: false, open: 'output_template_output.xlsx', comment: false, mode: 'View' }],
  ['Files list at full screen', { full: true, rail: true, open: null, comment: false, mode: 'View' }],
];
const bar = $('#switcher');
STATES.forEach(([name, s], n) => {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { state = { ...s }; bar.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); draw(); };
  bar.appendChild(b);
  if (n === 0) b.click();
});
</script>
</body>
</html>
