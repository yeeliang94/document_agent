<!doctype html>
<!-- PROTOTYPE ONLY (plan Steps 51, 52 and 57). Made-up data. The dark bar at the bottom jumps between states.
     - Step 51, cost per run: the run's finish line shows the money beside the time ("13m 1s · $0.42"); a playbook's
       Activity tab starts with what its runs cost, and what re-checking past corrections cost. With no prices set in
       Settings, no money shows anywhere.
     - Step 52, several runs at once: a run past the limit says why it is waiting.
     - Step 57, delete a playbook: a Delete button beside Rename, a confirmation that says what goes and what stays,
       and the list after. The only playbook cannot be deleted. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cost, waiting runs and deleting a playbook (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --panel:#f5f5f6; --sheet:#fff; --text:#18181b; --muted:#6e6e76; --faint:#a3a3ab; --line:#e7e7ea; --accent:#2f6fdb; --ok-bg:#e6f3e6; --ok-fg:#24592a; --bad-bg:#fbe9e9; --bad-fg:#7a2020; --grey-bg:#ececee; --grey-fg:#55555c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.6 Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, p, ul { margin: 0; }
  h1 { font-size: 22px; font-weight: 500; }
  h2 { font-size: 15px; font-weight: 500; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .pill { display: inline-block; font-size: 12px; line-height: 20px; padding: 0 10px; border-radius: 999px; background: var(--grey-bg); color: var(--grey-fg); white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; }
  .btn.primary { background: var(--text); color: #fff; }
  .btn.danger { background: var(--bad-fg); color: #fff; }
  .btn.text { color: var(--muted); }
  .btn.text:hover { color: var(--text); }
  .btn:disabled { opacity: .4; cursor: default; }
  .icon-btn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
  .side { padding: 24px 12px; display: flex; flex-direction: column; gap: 16px; }
  .brand { font-weight: 500; padding: 0 12px; }
  .item { display: block; padding: 8px 12px; border-radius: 12px; color: var(--muted); text-align: left; width: 100%; }
  .item.on { background: var(--panel); color: var(--text); }
  .main { padding: 24px 32px 120px; min-width: 0; }
  .col { max-width: 720px; display: flex; flex-direction: column; gap: 20px; }
  .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .head h1 { flex: 1 1 200px; }
  .controls { display: flex; align-items: center; gap: 4px; }
  .me { align-self: flex-end; background: var(--panel); border-radius: 12px; padding: 12px 16px; max-width: 70%; }
  .live { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .report { display: flex; flex-direction: column; gap: 12px; }
  .report-top { display: flex; align-items: baseline; gap: 12px; }
  .report-top p { flex: 1; }
  .spent { color: var(--faint); font-size: 13px; white-space: nowrap; }
  .filerow { display: flex; align-items: center; gap: 12px; background: var(--panel); border-radius: 12px; padding: 12px 16px; }
  .filerow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button { padding: 4px 12px; border-radius: 999px; color: var(--muted); font-size: 13px; }
  .tabs button.on { background: var(--panel); color: var(--text); }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 24px; background: var(--panel); border-radius: 12px; padding: 12px 16px; }
  .facts div { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
  .facts span:first-child { color: var(--muted); }
  .rows { display: flex; flex-direction: column; }
  .rows .r { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .rows .r span:last-child { color: var(--muted); }
  .list .r { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 12px; background: var(--panel); margin-bottom: 8px; }
  .list .r span:last-child { color: var(--muted); font-size: 13px; }
  .scrim { position: fixed; inset: 0; background: rgba(24,24,27,.24); display: grid; place-items: center; z-index: 5; padding: 16px; }
  .dialog { background: var(--bg); border-radius: 12px; padding: 24px; width: 440px; max-width: 100%; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.16); }
  .dialog p { color: var(--muted); }
  .dialog .end { display: flex; justify-content: flex-end; gap: 8px; }
  .toast { position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); background: var(--text); color: #fff; border-radius: 12px; padding: 10px 16px; font-size: 13px; }
  .switcher { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #18181b; color: #fff; border-radius: 20px; padding: 4px; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; font-size: 12px; z-index: 9; width: max-content; max-width: calc(100% - 32px); }
  .switcher button { padding: 4px 12px; border-radius: 999px; color: #c9c9cf; white-space: nowrap; }
  .switcher button.on { background: #fff; color: #18181b; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } .side { display: none; } .main { padding: 16px 16px 140px; } }
</style>
</head>
<body>
<div class="app">
  <nav class="side"><div class="brand">Document Intelligence</div>
    <div><button class="item" data-side="run">October 2026 payroll</button><button class="item" data-side="playbooks">Playbooks</button></div></nav>
  <main class="main" id="main"></main>
</div>
<div class="switcher" id="switcher"></div>
<script>
const X = '<svg viewBox="0 0 16 16"><path d="M10 4 6 8l4 4"/></svg>';
let state = {};
const RESET = { view: 'run', run: 'done', priced: true, tab: 'activity', dialog: false, deleted: false, only: false };

function runHtml() {
  const head = `<div class="head"><h1>October 2026 payroll</h1><div class="controls">${state.run === 'waiting' ? '<span class="pill">Waiting</span>' : '<span class="pill ok">Finished</span>'}<button class="btn text">Payroll</button><button class="btn text">Technical log</button></div></div>`;
  const me = '<div class="me">Build the October payroll from the folder.</div>';
  if (state.run === 'waiting') {
    return `<div class="col">${head}${me}<p class="live"><span class="dot"></span>Waiting for a free slot. 2 runs at once is the limit in Settings.</p></div>`;
  }
  const spent = state.priced ? '13m 1s · $0.42' : '13m 1s';
  return `<div class="col">${head}${me}<div class="report"><div class="report-top"><p>The workbook is ready: 215 employees across five entities.</p><span class="spent">${spent}</span></div>
    <div class="filerow"><span class="name">october_2026_payroll.xlsx</span><span class="pill ok">Checked</span><button class="btn primary">Download</button></div></div></div>`;
}

function playbookHtml() {
  const tabs = [['instructions', 'Instructions'], ['skills', 'Skills'], ['tests', 'Past corrections'], ['activity', 'Activity'], ['history', 'History']]
    .map(([id, l]) => `<button class="${state.tab === id ? 'on' : ''}" data-tab="${id}">${l}</button>`).join('');
  const cost = state.priced
    ? `<div class="facts"><div><span>18 runs</span><span>$12.40</span></div><div><span>Re-checking past corrections</span><span>$1.10</span></div></div>`
    : '';
  const body = state.tab === 'activity'
    ? `${cost}<div class="rows"><div class="r"><span>Saved version 7 of the instructions</span><span>24 Nov</span></div><div class="r"><span>Learned a rule from October payroll</span><span>21 Nov</span></div><div class="r"><span>Re-checked 14 past corrections: all still right</span><span>21 Nov</span></div></div>`
    : '<p style="color:var(--muted)">…</p>';
  const dialog = state.dialog
    ? `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg"><h2 id="dlg">Delete Payroll?</h2>
        <p>Its instructions, skills, past corrections and history go, and can't be brought back. Its 18 runs stay, and still open.</p>
        <div class="end"><button class="btn text" data-act="cancel">Cancel</button><button class="btn danger" data-act="delete">Delete playbook</button></div></div></div>`
    : '';
  const del = state.only
    ? '<button class="btn text" disabled title="The only playbook cannot be deleted">Delete</button>'
    : '<button class="btn text" data-act="ask">Delete</button>';
  return `<div class="col"><div class="head"><button class="icon-btn" aria-label="Back">${X}</button><h1>Payroll</h1><div class="controls"><button class="btn text">Rename</button>${del}</div></div>
    <div class="tabs">${tabs}</div>${body}</div>${dialog}`;
}

function playbooksHtml() {
  const rows = (state.deleted ? [] : [['Payroll', '18 runs']]).concat([['Bank reconciliation', '6 runs'], ['Expense claims', '2 runs']]);
  return `<div class="col"><div class="head"><h1>Playbooks</h1><button class="btn primary">New playbook</button></div>
    <div class="list">${rows.map(([n, r]) => `<div class="r"><span>${n}</span><span>${r}</span></div>`).join('')}</div></div>
    ${state.deleted ? '<div class="toast">Deleted Payroll. Its 18 runs are kept.</div>' : ''}`;
}

function draw() {
  document.getElementById('main').innerHTML = state.view === 'run' ? runHtml() : state.view === 'playbook' ? playbookHtml() : playbooksHtml();
  document.querySelectorAll('.item').forEach((b) => b.classList.toggle('on', (b.dataset.side === 'run') === (state.view === 'run')));
}
document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  const tab = e.target.closest('[data-tab]')?.dataset.tab;
  if (act === 'ask') state.dialog = true;
  else if (act === 'cancel') state.dialog = false;
  else if (act === 'delete') Object.assign(state, { dialog: false, deleted: true, view: 'playbooks' });
  else if (tab) state.tab = tab;
  else return;
  draw();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.dialog) { state.dialog = false; draw(); } });
const STATES = [
  ['Run finished, with cost', {}],
  ['Run finished, no prices set', { priced: false }],
  ['Run waiting for a slot', { run: 'waiting' }],
  ['Playbook cost (Activity)', { view: 'playbook' }],
  ['Delete: confirm', { view: 'playbook', dialog: true }],
  ['After deleting', { view: 'playbooks', deleted: true }],
  ['Only playbook: no delete', { view: 'playbook', only: true }],
];
const bar = document.getElementById('switcher');
STATES.forEach(([name, s], n) => {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { state = { ...RESET, ...s }; bar.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); draw(); };
  bar.appendChild(b);
  if (n === 0) b.click();
});
</script>
</body>
</html>
