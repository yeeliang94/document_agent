<!doctype html>
<!-- PROTOTYPE ONLY: five batches of proposed changes to the run screens, with made-up data. Open this file in a
     browser; no server needed. The dark bar at the bottom switches batch (?batch=1..5) and state (&state=0..); it is
     not part of the design. Nothing here is wired to the app. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Improvements prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --panel: #f5f5f6; --sheet: #ffffff; --text: #18181b; --muted: #6e6e76; --faint: #a3a3ab;
    --line: #e7e7ea; --accent: #2f6fdb; --accent-bg: #e8f0fd; --ok-bg: #e6f3e6; --ok-fg: #24592a;
    --warn-bg: #fbf0dc; --warn-fg: #6b4206; --bad-bg: #fbe9e9; --bad-fg: #7a2020; --grey-bg: #ececee; --grey-fg: #55555c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.55 Geist, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; padding: 0; }
  h1, h2, h3, p, ul, ol { margin: 0; }
  h1 { font-size: 22px; font-weight: 500; }
  h2 { font-size: 15px; font-weight: 500; }
  h3 { font-size: 13px; font-weight: 400; color: var(--muted); }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; white-space: nowrap; }
  .btn.primary { background: var(--text); color: #fff; font-weight: 500; }
  .btn.quiet { box-shadow: inset 0 0 0 1px var(--line); }
  .btn.text { padding: 8px 12px; color: var(--muted); }
  .btn.text:hover { color: var(--text); background: var(--panel); }
  .btn.small { padding: 4px 12px; font-size: 13px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .icon-btn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--grey-bg); color: var(--text); }
  .pill { display: inline-block; font-size: 12px; line-height: 20px; padding: 0 10px; border-radius: 999px; background: var(--grey-bg); color: var(--grey-fg); white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .pill.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .pill.bad { background: var(--bad-bg); color: var(--bad-fg); }
  .pill.live { background: var(--accent-bg); color: var(--accent); }
  .muted { color: var(--muted); }
  .file { color: var(--text); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }

  /* Shell */
  .app { display: grid; grid-template-columns: var(--side, 272px) 8px minmax(0, 1fr); height: calc(100% - 64px); }
  .app.slim { --side: 0px !important; }
  .app.slim .side { padding: 0; overflow: hidden; visibility: hidden; }
  .side { padding: 24px 12px 16px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .brand { font-weight: 500; padding: 0 12px; }
  .side .add { margin: 0 4px; justify-content: center; }
  .side h3 { padding: 0 12px 4px; }
  .runs { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; text-align: left; color: var(--muted); width: 100%; position: relative; }
  .item span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.on { background: var(--panel); color: var(--text); }
  .item:hover { color: var(--text); }
  .menu { position: absolute; right: 8px; top: 36px; z-index: 3; background: var(--bg); border-radius: 12px; padding: 4px; box-shadow: 0 8px 32px rgba(0,0,0,.12); display: flex; flex-direction: column; min-width: 140px; }
  .menu button { text-align: left; padding: 8px 12px; border-radius: 8px; }
  .menu button:hover { background: var(--panel); }
  main { min-width: 0; min-height: 0; display: flex; }

  /* Run screen */
  .work { flex: 1; display: grid; grid-template-columns: minmax(320px, 1fr) 8px var(--files, 380px); min-width: 0; padding: 16px 16px 16px 0; }
  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 0 24px; }
  .chat-head { display: flex; align-items: center; gap: 12px; padding: 16px 0 4px; min-height: 60px; }
  .chat-head h1 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .progress { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 13px; padding-bottom: 16px; }
  .progress .now { color: var(--text); }
  .progress .done { color: var(--muted); }
  .progress .budget { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .scroll { flex: 1; min-height: 0; overflow: auto; }
  .thread { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px; }
  .me { align-self: flex-end; max-width: 80%; background: var(--panel); border-radius: 12px; padding: 12px 16px; }
  .say { max-width: 62ch; }
  .grp-head { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .grp-body { margin: 8px 0 0 7px; padding-left: 16px; box-shadow: inset 1px 0 0 var(--line); display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .step { display: flex; gap: 8px; align-items: baseline; }
  .step time { margin-left: auto; color: var(--faint); }
  .live { display: flex; gap: 8px; align-items: baseline; color: var(--text); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); align-self: center; animation: pulse 1.4s infinite; }
  .think { color: var(--muted); font-size: 13px; padding-left: 16px; }
  @keyframes pulse { 50% { opacity: .3; } }
  .card { background: var(--panel); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card.bad { background: var(--bad-bg); }
  .card.warn { background: var(--warn-bg); }
  .card ul { padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
  .choices { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details pre { white-space: pre-wrap; font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--muted); margin: 8px 0 0; }
  .composer { max-width: 720px; width: 100%; margin: 0 auto; background: var(--panel); border-radius: 12px; display: flex; align-items: center; padding: 8px 8px 8px 16px; }
  .composer input { flex: 1; border: 0; background: none; outline: none; }
  .send { width: 32px; height: 32px; border-radius: 50%; background: var(--text); color: #fff; display: grid; place-items: center; }
  .send:disabled { opacity: .3; }
  .opt { display: flex; gap: 12px; align-items: flex-start; background: var(--sheet); border-radius: 12px; padding: 12px; text-align: left; width: 100%; }
  .opt kbd { font: inherit; font-size: 12px; width: 20px; height: 20px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; color: var(--muted); flex: none; }
  .opt .detail { display: block; color: var(--muted); font-size: 13px; }
  .opt .pill { margin-left: auto; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; box-shadow: inset 0 -1px 0 var(--line); }
  .row:last-child { box-shadow: none; }
  .row .name { flex: 1; min-width: 0; }
  .row .when { color: var(--muted); font-size: 13px; }
  .report h2 { font-size: 15px; }
  .report section { display: flex; flex-direction: column; gap: 4px; }
  .report li { max-width: 62ch; }
  .deliver { display: flex; align-items: center; gap: 12px; background: var(--panel); border-radius: 12px; padding: 12px 16px; }
  .deliver .name { flex: 1; }
  .tag { font-size: 10px; letter-spacing: .04em; color: var(--muted); width: 32px; text-transform: uppercase; }

  /* Files panel and divider */
  .grip { cursor: col-resize; display: grid; place-items: center; }
  .grip::after { content: ''; width: 2px; height: 32px; border-radius: 2px; background: var(--line); }
  .grip:hover::after { background: var(--faint); }
  .files { background: var(--panel); border-radius: 12px; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .files-head { display: flex; align-items: center; gap: 8px; padding: 16px 24px 8px; min-height: 56px; }
  .files-head h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files-body { flex: 1; overflow: auto; padding: 0 24px 24px; display: flex; flex-direction: column; gap: 24px; }
  .files-foot { display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 24px; }
  .files-foot span { flex: 1; color: var(--muted); }
  .list { display: flex; flex-direction: column; }
  .frow { display: flex; align-items: center; gap: 12px; padding: 12px 0; box-shadow: inset 0 1px 0 var(--line); text-align: left; }
  .frow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modes { background: var(--grey-bg); border-radius: 999px; padding: 2px; display: flex; }
  .modes button { padding: 2px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
  .modes button[aria-pressed="true"] { background: var(--sheet); color: var(--text); }
  .sheet { background: var(--sheet); border-radius: 12px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .grid td, .grid th { padding: 8px 12px; text-align: left; box-shadow: inset 0 -1px 0 var(--line); white-space: nowrap; }
  .grid th { color: var(--faint); font-weight: 400; }
  .grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .grid tr.head td { background: #253b5b; color: #fff; font-weight: 500; }
  .grid tr.sel td { background: var(--accent-bg); }
  .grid td.pick { box-shadow: inset 0 0 0 2px var(--accent); }
  .grid tr.total td { font-weight: 500; }
  .proof td { padding: 12px 0; box-shadow: inset 0 1px 0 var(--line); vertical-align: top; }
  .proof td:first-child { color: var(--muted); width: 120px; }
  .proof td.num { text-align: right; font-variant-numeric: tabular-nums; width: 80px; padding-right: 16px; }
  .pop { position: absolute; right: 48px; top: 300px; width: 320px; background: var(--bg); border-radius: 12px; padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.14); display: flex; flex-direction: column; gap: 12px; z-index: 2; }
  .pop textarea { border: 0; background: var(--panel); border-radius: 12px; padding: 12px; min-height: 72px; resize: none; outline: none; }
  .pop .line { display: flex; align-items: center; gap: 12px; }
  .pop .line span { flex: 1; }
  .switch { width: 36px; height: 20px; border-radius: 999px; background: var(--grey-bg); position: relative; flex: none; }
  .switch::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch.on { background: var(--text); }
  .switch.on::after { transform: translateX(16px); }
  .doc { background: var(--sheet); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .doc ul { padding-left: 20px; }

  /* Pages */
  .page { flex: 1; overflow: auto; padding: 48px 24px; }
  .narrow { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  .page-head { display: flex; align-items: center; gap: 12px; }
  .page-head h1 { flex: 1; }
  .rows { background: var(--panel); border-radius: 12px; padding: 16px; }
  .rows h2 { padding-bottom: 4px; }
  .rows .row > span:first-child { flex: 1; color: var(--muted); }
  .rows .row.err { flex-wrap: wrap; }
  .rows .row.err p { flex-basis: 100%; color: var(--bad-fg); font-size: 13px; text-align: right; }
  .unit { display: flex; align-items: center; gap: 8px; background: var(--sheet); border-radius: 12px; padding: 0 12px; width: 180px; }
  .unit input { border: 0; outline: none; background: none; width: 100%; padding: 8px 0; text-align: right; font-variant-numeric: tabular-nums; }
  .unit span { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .unit.bad { box-shadow: inset 0 0 0 1px var(--bad-fg); }
  .stepper { display: flex; align-items: center; background: var(--sheet); border-radius: 999px; }
  .stepper button { width: 32px; height: 32px; color: var(--muted); }
  .stepper b { font-weight: 400; min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
  .seg { display: flex; background: var(--sheet); border-radius: 999px; padding: 2px; }
  .seg button { white-space: nowrap; padding: 4px 10px; border-radius: 999px; color: var(--muted); font-size: 13px; }
  .seg button.on { background: var(--text); color: #fff; }
  .value { font-variant-numeric: tabular-nums; }

  /* Prototype bar, not part of the design */
  .proto { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 9; background: #18181b; color: #fff; border-radius: 999px; padding: 6px 8px; display: flex; gap: 4px; align-items: center; font-size: 13px; box-shadow: 0 8px 32px rgba(0,0,0,.3); white-space: nowrap; }
  .proto button { padding: 4px 12px; border-radius: 999px; color: #c9c9cf; }
  .proto button:hover { color: #fff; }
  .proto button[aria-pressed="true"] { background: #fff; color: #18181b; }
  .proto b { font-weight: 500; padding: 0 8px; }
  .proto .sep { width: 1px; height: 20px; background: #3a3a3f; margin: 0 4px; }
</style>
</head>
<body>
<div class="app"><aside class="side" id="side"></aside><div class="grip" id="side-grip" title="Drag to resize, double-click to hide"></div><main id="main"></main></div>
<div class="proto" id="proto"></div>
<script>
const I = {
  plus: 'M12 5v14M5 12h14', send: 'M12 19V5M6 11l6-6 6 6', x: 'M6 6l12 12M18 6L6 18', back: 'M15 6l-6 6 6 6',
  chev: 'M9 6l6 6-6 6', open: 'M6 9l6 6 6-6', down: 'M12 4v12M7 11l5 5 5-5M5 20h14', find: 'M10.5 17a6.5 6.5 0 100-13 6.5 6.5 0 000 13zM15.5 15.5L20 20',
  more: 'M6 12h.01M12 12h.01M18 12h.01',
};
const icon = (n) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${I[n]}"/></svg>`;
const pill = (tone, text) => `<span class="pill ${tone}">${text}</span>`;
const file = (name) => `<a class="file" href="#">${name}</a>`;

const BATCHES = [
  { name: 'Waiting', states: ['Working', 'Near the limit', 'Question'] },
  { name: 'When a run stops', states: ['Stopped midway', 'Earlier versions', 'Nothing saved'] },
  { name: 'Finished', states: ['Finished', 'Partly done'] },
  { name: 'Reviewing', states: ['Where a row came from', 'Comment', 'Notes'] },
  { name: 'Run list and settings', states: ['Settings', 'Wrong value', 'Run menu'] },
  { name: 'Clients', states: ['Client list', 'One client', 'New run', 'Remember for a client'] },
];
const params = new URLSearchParams(location.search);
let batch = Math.min(BATCHES.length, Math.max(1, Number(params.get('batch')) || 1));
let state = Math.min(BATCHES[batch - 1].states.length - 1, Math.max(0, Number(params.get('state')) || 0));

// --- Shell -----------------------------------------------------------------

const RUNS = [
  ['October payroll', 'live', 'Working'], ['AP invoices, week 47', 'warn', 'Needs you'],
  ['September payroll', 'ok', 'Finished'], ['Joiners and leavers Q3', 'warn', 'Partly done'], ['Bank statements, August', 'bad', 'Stopped'],
];
function side(menu) {
  const status = { 1: ['live', 'Working'], 2: ['bad', 'Stopped'], 3: ['ok', 'Finished'], 4: ['ok', 'Finished'], 6: ['ok', 'Finished'] }[batch];
  const rows = RUNS.map(([name, tone, label], i) => {
    const [t, l] = i === 0 && status ? status : [tone, label];
    const on = i === 0 && (batch < 5 || (batch === 6 && state === 3));
    return `<div class="item ${on ? 'on' : ''}"><span>${name}</span>${pill(t, l)}${menu && i === 2 ? `<button class="icon-btn" aria-label="More">${icon('more')}</button>
      <div class="menu"><button>Rename</button><button>Duplicate</button><button>Delete</button></div>` : ''}</div>`;
  }).join('');
  return `<div class="brand">Document Intelligence</div>
    <button class="btn quiet add">${icon('plus')}New run</button>
    <nav class="runs"><h3>Recent</h3>${rows}</nav>
    <div><div class="item"><span>Playbooks</span></div><div class="item ${batch === 6 && state < 2 ? 'on' : ''}"><span>Clients</span></div><div class="item ${batch === 5 ? 'on' : ''}"><span>Settings</span></div></div>`;
}

const head = (tone, label, controls) => `<header class="chat-head"><h1>October payroll</h1>${pill(tone, label)}${controls}</header>`;
const stages = (at, budget) => {
  const names = ['Reading files', 'Filling in', 'Checking'];
  return `<div class="progress">${names.map((n, i) => `<span class="${i < at ? 'done' : i === at ? 'now' : ''}">${n}</span>`).join('<span>›</span>')}<span class="budget">${budget}</span></div>`;
};
const me = (text) => `<div class="me">${text}</div>`;
const step = (text, f, secs) => `<div class="step"><span>${text}</span>${f ? file(f) : ''}${secs ? `<time>${secs}</time>` : ''}</div>`;
const group = (title, took, open, body = '') => `<div><div class="grp-head">${icon(open ? 'open' : 'chev')}<span>${title}</span><span class="muted">${took}</span></div>${open ? `<div class="grp-body">${body}</div>` : ''}</div>`;
const READ = step('Opened the packet', '', '3s') + step('Read the task instructions', 'instructions.txt', '4s') + step('Read the employee report', 'employee_report.xlsx', '4s') + step('Read the scanned salary confirmation', 'salary_confirmation.png', '5s');
const composer = (hint, off) => `<form class="composer"><input placeholder="${hint}" ${off ? 'disabled' : ''}><button type="button" class="send" disabled aria-label="Send">${icon('send')}</button></form>`;
const run = (headHtml, stagesHtml, thread, foot, files) => `<div class="work" id="work"><section class="chat">${headHtml}${stagesHtml}
  <div class="scroll"><div class="thread">${thread}</div></div>${foot}</section><div class="grip" id="grip"></div><aside class="files">${files}</aside></div>`;

function filesList({ output = '', checks = '', pills = ['Read', 'Read', 'Read'] } = {}) {
  const src = [['xlsx', 'employee_report.xlsx'], ['png', 'salary_confirmation.png'], ['txt', 'instructions.txt']];
  return `<div class="files-head"><h2>Files</h2></div><div class="files-body">
    <div class="list"><h3>Output</h3>${output || '<div class="frow muted">Nothing yet</div>'}</div>${checks}
    <div class="list"><h3>Sources</h3>${src.map(([t, n], i) => `<div class="frow"><span class="tag">${t}</span><span class="name">${n}</span>${pills[i] ? pill(pills[i] === 'Used' ? 'ok' : '', pills[i]) : ''}</div>`).join('')}</div></div>`;
}
const OUT = (status) => `<div class="frow"><span class="tag">xlsx</span><span class="name">October payroll.xlsx</span>${status}</div><div class="frow"><span class="tag">md</span><span class="name">Notes</span></div>`;
const CHECKS = (bad) => `<div class="list"><h3>Checks</h3>
  <div class="frow"><span class="name">Template rules</span>${bad ? pill('warn', '1 problem') : pill('ok', 'Passed')}</div>
  <div class="frow"><span class="name">Totals add up</span>${pill('ok', '162,000')}</div>
  <div class="frow"><span class="name">Every file decided</span>${pill('ok', '3 of 3')}</div>
  <div class="frow"><span class="name">Every row has a source</span>${bad ? pill('warn', '2 of 3') : pill('ok', '3 of 3')}</div></div>`;

// --- Batch 1: waiting ------------------------------------------------------

function waiting() {
  const controls = `<button class="btn text">Pause</button><button class="btn text">Stop</button>`;
  if (state === 0) {
    return run(head('live', 'Working', controls), stages(1, 'Step 14 of 60 · 6 of 30 min'),
      me('Fill the October payroll template from the packet.') + group('Read 3 files', '17s', false) +
      group('Filling the Employees sheet', '2m 10s', true, step('Matched 3 employees by ID', 'employee_report.xlsx', '12s') +
        `<div class="live"><i></i><span>Comparing salaries between the report and the signed letter</span><time class="muted">38s</time></div>
         <div class="think">The letter is dated after the report, so it may replace the report's figure for one employee.</div>`),
      composer('Message the agent'), filesList({ pills: ['Read', 'Read', 'Read'] }));
  }
  if (state === 1) {
    return run(head('warn', 'Wrapping up', controls), stages(2, 'Step 52 of 60 · 26 of 30 min'),
      me('Fill the October payroll template from the packet.') + group('Read 3 files', '17s', false) + group('Filled the Employees sheet', '21m', false) +
      `<div class="card warn"><p>8 steps left. The agent is saving its work and writing down what is still open.</p>
        <div class="choices"><button class="btn primary">Give it 20 more steps</button><button class="btn text">Let it wrap up</button></div></div>
       <div class="live"><i></i><span>Saving the workbook</span><time class="muted">6s</time></div>`,
      composer('Message the agent'), filesList({ output: OUT(pill('warn', 'Draft')), pills: ['Used', 'Used', 'Read'] }));
  }
  return run(head('warn', 'Needs your answer', `<button class="btn text">Stop</button>`), stages(1, 'Clock paused at 6 of 30 min'),
    me('Fill the October payroll template from the packet.') + group('Read 3 files', '17s', false) +
    `<div class="card"><h2>Which salary should I use for Alex Example?</h2>
      <p class="muted">4,200 in ${file('employee_report.xlsx')}, row 2 · 4,500 in ${file('salary_confirmation.png')}</p>
      <button class="opt"><kbd>1</kbd><span>4,500<span class="detail">The signed letter, dated later.</span></span>${pill('live', 'Suggested')}</button>
      <button class="opt"><kbd>2</kbd><span>4,200<span class="detail">The HR report.</span></span></button>
      <div class="opt"><kbd>3</kbd><span class="muted">Something else</span></div>
      <div class="choices"><button class="btn text">Let the agent decide</button></div></div>`,
    '', filesList({ pills: ['Read', 'Read', 'Read'] }));
}

// --- Batch 2: a run that stopped ---------------------------------------------

const VERSIONS = [['Step 9', 'Employees sheet filled, 3 rows', '10:42'], ['Step 6', 'All files read, notes written', '10:39'], ['Start', 'Empty template', '10:36']];
function stopped() {
  const before = me('Fill the October payroll template from the packet.') + group('Read 3 files', '17s', false) + group('Filled the Employees sheet', '2m 40s', false);
  const raw = `<details><summary>Technical detail</summary><pre>NotFoundError: Error code: 404 - container not found\nrun-01 · step 11 · 10:43:07</pre></details>`;
  let card;
  if (state === 0) {
    card = `<div class="card bad"><h2>The AI service dropped the connection</h2>
      <p>Your work is saved up to step 9: Employees sheet filled, 3 rows.</p>
      <div class="choices"><button class="btn primary">Continue from step 9</button><button class="btn text">Earlier versions</button><button class="btn text">Start over</button></div>${raw}</div>`;
  } else if (state === 1) {
    card = `<div class="card"><h2>Saved versions</h2><div>${VERSIONS.map(([s, what, when], i) => `<div class="row"><span class="name">${s} · ${what}</span><span class="when">${when}</span>
      ${i === 0 ? pill('ok', 'Latest') : '<button class="btn quiet small">Continue from here</button>'}</div>`).join('')}</div></div>`;
  } else {
    card = `<div class="card bad"><h2>The AI service could not be reached</h2>
      <p>The run stopped before anything was saved. Your files are still uploaded.</p>
      <div class="choices"><button class="btn primary">Try again</button><button class="btn text">Check the connection</button></div>${raw}</div>`;
  }
  return run(head('bad', 'Stopped', ''), stages(state === 2 ? 0 : 1, state === 2 ? 'Step 1 of 60' : 'Step 11 of 60 · 4 of 30 min'),
    (state === 2 ? me('Fill the October payroll template from the packet.') : before) + card, composer('Message the agent'),
    filesList(state === 2 ? { pills: [] } : { output: OUT(pill('warn', 'Draft')), pills: ['Used', 'Used', 'Read'] }));
}

// --- Batch 3: finished -------------------------------------------------------

function finished() {
  const partial = state === 1;
  const report = `<div class="report card" style="background:none;padding:0">
    <h2>${partial ? 'Stopped at the step limit with 2 things left to fix' : 'Done: 3 employees filled, totals add up'}</h2>
    <section><h3>What I did</h3><ul><li>Filled the Employees sheet from ${file('employee_report.xlsx')}.</li><li>Kept the Annual salary formulas; the total is 162,000.</li></ul></section>
    <section><h3>Decisions I made</h3><ul><li>Alex Example: used 4,500 from the signed letter, not 4,200 from the HR report. You chose this.</li><li>Priya Nair starts on 15 October; salary not pro-rated.</li></ul></section>
    ${partial ? `<section><h3>Still to fix</h3><ul><li>Row 4: the start date is not the first of the month.</li><li>Row 4: no source recorded for the salary.</li></ul></section>`
      : `<section><h3>Check before you send</h3><ul><li>Confirm Priya Nair's salary should not be pro-rated.</li></ul></section>`}
    </div>
    <div class="deliver"><span class="tag">xlsx</span><span class="name">October payroll.xlsx</span>${partial ? pill('warn', 'Draft') : pill('ok', 'Checked')}
      <button class="btn ${partial ? 'quiet' : 'primary'}">${icon('down')}Download</button></div>
    <div class="choices">${partial ? '<button class="btn primary">Continue</button>' : ''}<button class="btn text">Notes</button><button class="btn text">How it was done</button>
      <span class="muted" style="margin-left:auto;font-size:13px">${partial ? '60 steps · 28 min' : '14 steps · 4 min'}</span></div>`;
  return run(head(partial ? 'warn' : 'ok', partial ? 'Partly done' : 'Finished', ''), stages(partial ? 2 : 3, ''),
    me('Fill the October payroll template from the packet.') + group('Read 3 files', '17s', false) + me('4,500') + group('Filled and checked the Employees sheet', '3m 20s', false) + report,
    composer('Ask for a change'), filesList({ output: OUT(partial ? pill('warn', 'Draft') : pill('ok', 'Checked')), checks: CHECKS(partial), pills: ['Used', 'Used', 'Reference'] }));
}

// --- Batch 4: reviewing ------------------------------------------------------

function reviewing() {
  const thread = me('Fill the October payroll template from the packet.') + group('Read 3 files', '17s', false) +
    `<p class="say">Done: 3 employees filled, totals add up.</p>`;
  const tools = (mode) => `<div class="modes"><button aria-pressed="${mode === 'view'}">View</button><button aria-pressed="${mode === 'comment'}">Comment</button></div>
    <button class="icon-btn" aria-label="Find">${icon('find')}</button><button class="icon-btn" aria-label="Download">${icon('down')}</button><button class="icon-btn" aria-label="Close">${icon('x')}</button>`;
  const sheet = (sel, pick) => `<div class="sheet"><table class="grid"><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr>
    <tr class="head"><th>1</th><td>Employee ID</td><td>Name</td><td>Salary</td><td>Effective date</td><td>Annual salary</td></tr>
    <tr class="${sel ? 'sel' : ''}"><th>2</th><td>EMP001</td><td>Alex Example</td><td class="num">4,500</td><td>1 Oct 2026</td><td class="num">54,000</td></tr>
    <tr><th>3</th><td>EMP002</td><td>Sam Sample</td><td class="num ${pick ? 'pick' : ''}">5,100</td><td>1 Oct 2026</td><td class="num">61,200</td></tr>
    <tr><th>4</th><td>EMP003</td><td>Priya Nair</td><td class="num">3,900</td><td>15 Oct 2026</td><td class="num">46,800</td></tr>
    <tr class="total"><th>5</th><td>Total</td><td></td><td class="num">13,500</td><td></td><td class="num">162,000</td></tr></table></div>`;
  let panel;
  if (state === 0) {
    panel = `<div class="files-head"><button class="icon-btn" aria-label="Back">${icon('back')}</button><h2>October payroll.xlsx</h2>${tools('view')}</div>
      <div class="files-body">${sheet(true)}<div><h2>Row 2 came from</h2><table class="proof">
        <tr><td>Salary</td><td class="num">4,500</td><td>${file('salary_confirmation.png')} <span class="muted">signed letter</span></td></tr>
        <tr><td>Employee ID, name</td><td class="num"></td><td>${file('employee_report.xlsx')} <span class="muted">Employees, row 2</span></td></tr>
        <tr><td>Effective date</td><td class="num"></td><td>${file('employee_report.xlsx')} <span class="muted">Employees, row 2</span></td></tr>
        <tr><td>Annual salary</td><td class="num">54,000</td><td class="muted">Worked out: salary × 12</td></tr></table></div></div>`;
  } else if (state === 1) {
    panel = `<div class="files-head"><button class="icon-btn" aria-label="Back">${icon('back')}</button><h2>October payroll.xlsx</h2>${tools('comment')}</div>
      <div class="files-body">${sheet(false, true)}</div>
      <div class="files-foot"><span>1 comment</span><button class="btn primary">Send to agent</button></div>
      <div class="pop"><h2>Employees, cell C3</h2><textarea placeholder="What should change?">Sam's salary is 5,200 from November.</textarea>
        <div class="line"><span>Remember for next time</span><button class="switch on" role="switch" aria-checked="true" aria-label="Remember for next time"></button></div>
        <div class="choices" style="justify-content:flex-end"><button class="btn text">Cancel</button><button class="btn quiet">Add comment</button></div></div>`;
  } else {
    panel = `<div class="files-head"><button class="icon-btn" aria-label="Back">${icon('back')}</button><h2>Notes</h2>${tools('view')}</div>
      <div class="files-body"><div class="doc"><h2>Notes</h2><ul><li>Alex Example: the signed letter (4,500) won over the HR report (4,200).</li>
        <li>Priya Nair starts mid-month; salary not pro-rated.</li><li>No file was left out.</li></ul></div></div>`;
  }
  return run(head('ok', 'Finished', ''), stages(3, ''), thread, composer('Ask for a change'), panel).replace('class="work"', 'class="work" style="--files:58%;position:relative"');
}

// --- Batch 5: run list and settings ------------------------------------------

function settings() {
  const row = (label, control, error = '') => `<div class="row ${error ? 'err' : ''}"><span>${label}</span>${control}${error ? `<p>${error}</p>` : ''}</div>`;
  const unit = (value, u, bad) => `<label class="unit ${bad ? 'bad' : ''}"><input value="${value}">${u ? `<span>${u}</span>` : ''}</label>`;
  const stepper = (v) => `<span class="stepper"><button aria-label="Fewer">−</button><b>${v}</b><button aria-label="More">+</button></span>`;
  const sw = (on) => `<button class="switch ${on ? 'on' : ''}" role="switch" aria-checked="${on}"></button>`;
  const wrong = state === 1;
  return `<div class="page"><div class="narrow">
    <div class="page-head"><h1>Settings</h1><button class="btn primary" ${state === 0 ? 'disabled' : ''}>Save</button></div>
    <section class="rows"><h2>Agent</h2>
      ${row('Helper agents for large folders', stepper(0))}
      ${row('Second agent reviews the result', sw(false))}
      ${row('Record a source for every row', sw(true))}
      ${row('Thinking depth', `<span class="seg"><button>Low</button><button class="on">Medium</button><button>High</button></span>`)}
      ${row('Questions it may ask per run', stepper(3))}</section>
    <section class="rows"><h2>Limits per run</h2>
      ${row('Steps', unit(wrong ? '99999' : '60', '', wrong), wrong ? 'Choose a number from 10 to 200.' : '')}
      ${row('Time', unit('30', 'minutes'))}
      ${row('AI usage', unit('3', 'million tokens'))}
      ${row('Wait for your answer', unit('10', 'minutes'))}</section>
    <section class="rows"><h2>Limits per day</h2>
      ${row('AI usage', unit('30', 'million tokens'))}
      ${row('Used today', `<span class="value">0.4 of 30 million</span>`)}</section>
    <section class="rows"><h2>Connection</h2>
      ${row('Model', `<span class="value">gpt-5.4-mini</span>`)}
      ${row('Service address', `<span class="value">api.openai.com</span>`)}
      ${row('Connection', `<button class="btn quiet small">Test</button>`)}</section>
  </div></div>`;
}

// --- Batch 6: clients ----------------------------------------------------------
// A client is a named set of notes the agent follows on that client's runs, on top of the playbook. A run picks one
// client; a comment can be remembered for that client alone or for every run of the playbook.

const CLIENTS = [['Acme Manufacturing', 'Payroll, Accounts payable', 12], ['Borneo Timber', 'Payroll', 7], ['Citra Foods', 'Accounts payable', 3]];
const ACME = `Payroll
- Salaries come from the signed confirmation letters, not the HR report, when the two differ.
- Staff on the Johor site are paid in two halves; add both rows.
- Send questions about allowances to finance, never guess.

Accounts payable
- Invoices under 500 need no purchase order.`;
function clients() {
  const page = (body) => `<div class="page"><div class="narrow">${body}</div></div>`;
  if (state === 0) {
    return page(`<div class="page-head"><h1>Clients</h1><button class="btn primary">${icon('plus')}New client</button></div>
      <div class="rows">${CLIENTS.map(([n, books, runs]) => `<div class="row"><span style="color:var(--text)">${n}</span><span class="when">${books} · ${runs} runs</span>${icon('chev')}</div>`).join('')}</div>`);
  }
  if (state === 1) {
    return page(`<div class="page-head"><button class="icon-btn" aria-label="Back to clients">${icon('back')}</button><h1>Acme Manufacturing</h1><button class="btn text">Rename</button></div>
      <div class="choices"><span class="pill" style="background:var(--panel);color:var(--text)">Notes</span><button class="btn text small">Runs</button><button class="btn text small">History</button></div>
      <div class="rows"><textarea style="width:100%;min-height:280px;border:0;background:none;outline:none;resize:vertical">${ACME}</textarea></div>
      <div class="deliver"><span class="name">Added from October payroll: "Salaries come from the signed confirmation letters…"</span><button class="btn text small">Undo</button></div>
      <form class="composer" style="max-width:none"><input placeholder="Ask the agent to change these notes"><button type="button" class="send" disabled aria-label="Send">${icon('send')}</button></form>
      <div class="choices" style="justify-content:flex-end"><button class="btn primary" disabled>Save</button></div>`);
  }
  if (state === 2) {
    const row = (label, control) => `<div class="row"><span>${label}</span>${control}</div>`;
    const pick = (text) => `<span class="unit" style="width:auto;padding:8px 12px">${text}${icon('open')}</span>`;
    return page(`<div class="page-head"><h1>New run</h1></div>
      <div class="rows"><textarea placeholder="What should the agent produce?" style="width:100%;min-height:96px;border:0;background:none;outline:none;resize:none"></textarea></div>
      <div class="rows">${row('Source files', `<span class="when">payroll_packet.zip · 33 KB</span><button class="btn quiet small">Change</button>`)}
        ${row('Playbook', pick('Payroll'))}${row('Client', pick('Acme Manufacturing'))}</div>
      <div class="choices" style="justify-content:flex-end"><button class="btn text">More options</button><button class="btn primary">Start run</button></div>`);
  }
  const saved = state;
  state = 1;
  const html = reviewing();
  state = saved;
  return html.replace('<p class="say">Done: 3 employees filled, totals add up.</p>',
      `<p class="say">Done: 3 employees filled, totals add up.</p><div class="deliver"><span class="name">Following the notes for Acme Manufacturing</span><button class="btn text small">Open</button></div>`)
    .replace(/<div class="line"><span>Remember for next time<\/span>.*?<\/div>/s,
      `<div class="line"><span>Remember</span><span class="seg" style="background:var(--panel)"><button>This run</button><button class="on">Acme</button><button>All payroll</button></span></div>`);
}

// --- Drawing -----------------------------------------------------------------

function draw() {
  const kept = JSON.parse(localStorage.getItem('proto-widths') || '{}');
  const screen = [waiting, stopped, finished, reviewing, settings, clients][batch - 1];
  document.getElementById('side').innerHTML = side(batch === 5 && state === 2);
  document.getElementById('main').innerHTML = screen();
  if (kept.files) document.getElementById('work')?.style.setProperty('--files', kept.files);
  const b = BATCHES[batch - 1];
  document.getElementById('proto').innerHTML = `<button data-go="-1" aria-label="Previous batch">←</button><b>${batch} of ${BATCHES.length} · ${b.name}</b><button data-go="1" aria-label="Next batch">→</button>
    <span class="sep"></span>${b.states.map((s, i) => `<button data-state="${i}" aria-pressed="${i === state}">${s}</button>`).join('')}`;
  history.replaceState(null, '', `?batch=${batch}&state=${state}`);
}
function go(delta) {
  batch = ((batch - 1 + delta + BATCHES.length) % BATCHES.length) + 1;
  state = 0;
  draw();
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-go], [data-state]');
  if (e.target.closest('a')) e.preventDefault();
  if (!el) return;
  if (el.dataset.go) go(Number(el.dataset.go));
  else { state = Number(el.dataset.state); draw(); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
// Both dividers drag to resize: the run list on the left and the Files panel on the right. Widths are kept for
// the next visit; a double-click on the left divider hides or shows the run list.
const app = document.querySelector('.app');
const kept = JSON.parse(localStorage.getItem('proto-widths') || '{}');
if (kept.side) app.style.setProperty('--side', kept.side);
const keep = (name, value) => localStorage.setItem('proto-widths', JSON.stringify(Object.assign(kept, { [name]: value })));
document.addEventListener('pointerdown', (e) => {
  const left = e.target.id === 'side-grip';
  if (!left && e.target.id !== 'grip') return;
  const work = document.getElementById('work');
  e.target.setPointerCapture(e.pointerId);
  const move = (m) => {
    if (left) {
      app.classList.remove('slim');
      app.style.setProperty('--side', (kept.side = Math.min(420, Math.max(200, m.clientX)) + 'px'));
    } else {
      const box = work.getBoundingClientRect();
      work.style.setProperty('--files', (kept.files = Math.min(box.width - 336, Math.max(280, box.right - m.clientX - 16)) + 'px'));
    }
  };
  e.target.addEventListener('pointermove', move);
  e.target.addEventListener('pointerup', () => { e.target.removeEventListener('pointermove', move); keep(); }, { once: true });
});
document.addEventListener('dblclick', (e) => e.target.id === 'side-grip' && app.classList.toggle('slim'));
draw();
</script>
</body>
