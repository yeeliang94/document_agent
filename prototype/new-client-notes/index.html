<!doctype html>
<!-- PROTOTYPE ONLY (plan Step 50, redrawn 2026-11-26): after a client's first run, offer to keep what it learned.
     When a run finishes for a client with no notes yet, a slim strip at the top of the run says what the agent found
     worth keeping. Opened, it lists those things; one button saves them all to the client's notes (with Undo).
     A client with no notes shows a plain notes box. Made-up data. The dark bar at the bottom jumps between states. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First run for a client: keep what it learned (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --panel: #f5f5f6; --sheet: #ffffff; --text: #18181b; --muted: #6e6e76; --faint: #a3a3ab;
    --line: #e7e7ea; --accent: #2f6fdb; --accent-bg: #e8f0fd; --ok-bg: #e6f3e6; --ok-fg: #24592a;
    --grey-bg: #ececee; --grey-fg: #55555c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.6 Geist, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  button, textarea { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, p, ul { margin: 0; }
  h1 { font-size: 22px; font-weight: 500; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .pill { display: inline-block; font-size: 12px; line-height: 20px; padding: 0 10px; border-radius: 999px; background: var(--grey-bg); color: var(--grey-fg); white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; }
  .btn.primary { background: var(--text); color: #fff; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.outline { box-shadow: inset 0 0 0 1px var(--line); background: var(--bg); }
  .btn.quiet { color: var(--muted); }
  .btn.quiet:hover { color: var(--text); }
  .icon-btn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
  .icon-btn:hover { background: var(--grey-bg); color: var(--text); }
  .link { color: var(--accent); font-size: 13px; }

  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
  .side { padding: 24px 12px 16px; display: flex; flex-direction: column; gap: 16px; }
  .brand { font-weight: 500; padding: 0 12px; }
  .item { display: block; padding: 8px 12px; border-radius: 12px; color: var(--muted); text-align: left; width: 100%; }
  .item.on { background: var(--panel); color: var(--text); }
  .main { padding: 24px 32px 96px; min-width: 0; }
  .col { max-width: 720px; display: flex; flex-direction: column; gap: 24px; }
  .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .head h1 { margin-right: auto; }
  .head .muted { color: var(--muted); font-size: 13px; }

  /* The offer: one slim line until opened */
  .offer { background: var(--panel); border-radius: 12px; }
  .offer-line { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; min-height: 44px; }
  .offer-line .open { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; text-align: left; font-size: 13px; }
  .offer-line .open span { min-width: 0; }
  .offer-line .open svg { width: 12px; height: 12px; color: var(--muted); transition: transform .12s; }
  .offer-line .open[aria-expanded="true"] svg { transform: rotate(90deg); }
  .offer-line .open .count { color: var(--muted); }
  .offer-body { padding: 0 16px 16px 36px; display: flex; flex-direction: column; gap: 12px; }
  .offer-body ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .offer-body .end { display: flex; gap: 8px; }
  .saved { display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-height: 44px; font-size: 13px; flex-wrap: wrap; }
  .saved .what { margin-right: auto; }

  .say { color: var(--text); }
  .report { display: flex; flex-direction: column; gap: 12px; }
  .report h2 { font-size: 14px; font-weight: 500; }
  .report ul { padding-left: 18px; color: var(--text); }
  .filerow { display: flex; align-items: center; gap: 12px; background: var(--panel); border-radius: 12px; padding: 12px 16px; }
  .filerow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 10px; color: var(--muted); width: 32px; text-transform: uppercase; letter-spacing: .04em; flex: none; }

  /* Client page */
  .tabs { display: flex; gap: 4px; }
  .tabs button { padding: 4px 12px; border-radius: 999px; color: var(--muted); font-size: 13px; }
  .tabs button.on { background: var(--panel); color: var(--text); }
  textarea { width: 100%; min-height: 240px; border: 0; border-radius: 12px; background: var(--panel); padding: 16px; resize: vertical; outline: none; line-height: 1.6; }
  textarea::placeholder { color: var(--faint); }
  .row-end { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
  .note { color: var(--muted); font-size: 13px; margin-right: auto; }

  .switcher { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #18181b; color: #fff; border-radius: 20px; padding: 4px; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; font-size: 12px; z-index: 9; width: max-content; max-width: calc(100% - 32px); }
  .switcher button { padding: 4px 12px; border-radius: 999px; color: #c9c9cf; white-space: nowrap; }
  .switcher button.on { background: #fff; color: #18181b; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .side { display: none; }
    .main { padding: 16px 16px 120px; }
    .offer-body { padding-left: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand">Document Intelligence</div>
    <div><button class="item" data-go="run">October 2026 payroll</button><button class="item" data-go="client">Northwind Trading</button></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="switcher" id="switcher"></div>
<script>
const svg = (d) => `<svg viewBox="0 0 16 16"><path d="${d}"/></svg>`;
const CHEV = 'M6 4l4 4-4 4', X = 'M4 4l8 8M12 4l-8 8', DOWN = 'M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10';
const LEARNED = [
  'The FINAL payroll register wins over a DRAFT or "superseded" copy of the same month.',
  'Singapore amounts are converted at the month-end rate in fx_rates_2026.xlsx.',
  'UK leavers after the 15th are paid in full this month and dropped next month.',
  'Stipends go in Allowances; there is no separate one-time payment column.',
];
const NOTES = LEARNED.map((l) => `- ${l}`).join('\n');
let state = {};
const RESET = { view: 'run', offer: 'folded', notes: '', saved: '' };

function offerHtml() {
  if (state.offer === 'gone') return '';
  if (state.offer === 'saved') {
    return `<div class="offer"><div class="saved"><span class="what">Saved to Northwind Trading's notes.</span>
      <button class="link" data-act="undo">Undo</button><button class="link" data-go="client">View notes</button>
      <button class="icon-btn" data-act="hide" aria-label="Close">${svg(X)}</button></div></div>`;
  }
  const open = state.offer === 'open';
  return `<div class="offer"><div class="offer-line">
      <button class="open" data-act="toggle" aria-expanded="${open}">${svg(CHEV)}<span>First run for Northwind Trading: <span class="count">${LEARNED.length} things worth keeping for next time</span></span></button>
      <button class="icon-btn" data-act="notnow" aria-label="Not now" title="Not now">${svg(X)}</button></div>
    ${open ? `<div class="offer-body"><ul>${LEARNED.map((l) => `<li>${l}</li>`).join('')}</ul>
      <div class="end"><button class="btn primary" data-act="save">Save to notes</button><button class="btn quiet" data-act="notnow">Not now</button></div></div>` : ''}</div>`;
}

function runHtml() {
  return `<div class="col">
    <div class="head"><h1>October 2026 payroll</h1><span class="pill ok">Finished</span><span class="muted">Payroll · Northwind Trading</span></div>
    ${offerHtml()}
    <div class="report">
      <p class="say">The workbook is ready: 215 employees across five entities, with the October joiners and leavers reconciled.</p>
      <h2>Decisions I made</h2>
      <ul><li>Took the SG01 FINAL register over its superseded draft.</li><li>Converted SGD at the month-end rate.</li><li>Left two UK leavers out of next month's list.</li></ul>
      <div class="filerow"><span class="tag">xlsx</span><span class="name">northwind_payroll_October_2026.xlsx</span><span class="pill ok">Checked</span><button class="btn outline">${svg(DOWN)}Download</button></div>
    </div></div>`;
}

function clientHtml() {
  return `<div class="col">
    <div class="head"><h1>Northwind Trading</h1><button class="btn quiet">Rename</button></div>
    <div class="tabs"><button class="on">Notes</button><button>Runs</button><button>History</button></div>
    <textarea aria-label="Notes for Northwind Trading" placeholder="Rules every run for this client should follow">${state.notes}</textarea>
    <div class="row-end">${state.saved ? `<span class="note">${state.saved}</span>` : ''}<button class="btn primary" disabled>Save</button></div></div>`;
}

function draw() {
  document.getElementById('main').innerHTML = state.view === 'run' ? runHtml() : clientHtml();
  document.querySelectorAll('.item').forEach((b) => b.classList.toggle('on', b.dataset.go === state.view));
}

document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  const go = e.target.closest('[data-go]')?.dataset.go;
  if (act === 'toggle') state.offer = state.offer === 'open' ? 'folded' : 'open';
  else if (act === 'save') Object.assign(state, { offer: 'saved', notes: NOTES, saved: 'Version 2 · From the October 2026 payroll run' });
  else if (act === 'undo') Object.assign(state, { offer: 'open', notes: '', saved: '' });
  else if (act === 'notnow' || act === 'hide') state.offer = 'gone';
  else if (go) state.view = go;
  else return;
  draw();
});

const STATES = [
  ['Run finished, offer folded', {}],
  ['Offer open', { offer: 'open' }],
  ['Saved', { offer: 'saved', notes: NOTES, saved: 'Version 2 · From the October 2026 payroll run' }],
  ['Not now', { offer: 'gone' }],
  ['New client, empty notes', { view: 'client' }],
  ['Notes after saving', { view: 'client', offer: 'saved', notes: NOTES, saved: 'Version 2 · From the October 2026 payroll run' }],
];
const bar = document.getElementById('switcher');
STATES.forEach(([name, s], n) => {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { state = { ...RESET, ...s }; bar.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); draw(); };
  bar.appendChild(b);
  if (n === 0) b.click();
});
</script>
</body>
</html>
